[project]
name = "catra-rekordbox"
version = "0.1.0"
description = "Rekordbox integration for Catra via pyrekordbox"
requires-python = ">=3.8"
dependencies = [
    "pyrekordbox",
]

[project.scripts]
catra-rekordbox = "catra_rekordbox.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["catra_rekordbox*"]
