[package]
name = "catra"
version = "0.1.0"
edition = "2021"

description = "Track manager for DJ."
authors = ["potistudio <potistudio@proton.me>"]
license = "MIT"
publish = false

[lib]
name = "catra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", default-features = false, features = ["cache"] }
libsqlite3-sys = { version = "0.38", features = ["bundled-sqlcipher"] }
lofty = "0.22"
walkdir = "2"
chrono = "0.4"
tiny_http = "0.12"
encoding_rs = "0.8"
flate2 = "1"
sysinfo = "0.37"
dirs = "6"
